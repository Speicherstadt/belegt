# Belegt aus dem Quellcode gebaut (Entwicklung, CI). Zum Betreiben: deploy/compose.yml mit dem fertigen Image.
name: belegt

services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: belegt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: belegt
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belegt -d belegt"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      # Docker sucht sonst nach Dockerfile; Podman fände Containerfile auch so
      dockerfile: Containerfile
    image: belegt:lokal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &umgebung
      DATABASE_URL: postgres://belegt:${POSTGRES_PASSWORD}@postgres:5432/belegt
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET in .env setzen (mindestens 32 Zeichen)}
      BETTER_AUTH_URL: ${BELEGT_URL:-http://localhost:3000}
      BELEGT_SCHLUESSEL: ${BELEGT_SCHLUESSEL:?BELEGT_SCHLUESSEL in .env setzen (openssl rand -base64 32)}
      ABRUF_MINUTEN: ${ABRUF_MINUTEN:-5}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      BELEGT_EMBED_ORIGIN: ${BELEGT_EMBED_ORIGIN:-}
      S3_ENDPUNKT: ${S3_ENDPUNKT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ZUGANG_ID: ${S3_ZUGANG_ID:-}
      S3_ZUGANG_GEHEIMNIS: ${S3_ZUGANG_GEHEIMNIS:-}
      S3_PFAD_STIL: ${S3_PFAD_STIL:-}
      S3_SPERRE_TAGE: ${S3_SPERRE_TAGE:-}
      TSA_URL: ${TSA_URL:-}
      KI_URL: ${KI_URL:-}
      KI_MODELL: ${KI_MODELL:-}
      VORSCHAU_URL: ${VORSCHAU_URL:-}
      EINGANG_ORDNER: ${EINGANG_ORDNER:-}
      EINGANG_ORDNER_TAGS: ${EINGANG_ORDNER_TAGS:-}
      TRENNBLATT_CODE: ${TRENNBLATT_CODE:-}
      IMPORT_MAX_GB: ${IMPORT_MAX_GB:-}
      OEFFNEN_MIT_NAME: ${OEFFNEN_MIT_NAME:-}
      OEFFNEN_MIT_URL: ${OEFFNEN_MIT_URL:-}
    ports:
      - "${BELEGT_PORT:-3000}:3000"
    volumes:
      - dokumente:/var/lib/belegt

  # Postfächer, Webhooks, Text und Texterkennung; startet, wenn der Server die Migrationen angewendet hat
  worker:
    image: belegt:lokal
    restart: unless-stopped
    command: ["bun", "server/worker.ts"]
    depends_on:
      server:
        condition: service_healthy
    environment: *umgebung
    networks: [default, vorschau]
    volumes:
      - dokumente:/var/lib/belegt
      # Eingangsordner, etwa für einen Scanner (docs/eingang.md): mkdir eingang && sudo chown 1000 eingang,
      # EINGANG_ORDNER=/var/lib/belegt/eingang in .env und diese Zeile einkommentieren
      # - ./eingang:/var/lib/belegt/eingang
    healthcheck:
      disable: true

  # SMTP-Journal, nur mit: docker compose --profile journal up -d (docs/eingang.md)
  smtp:
    image: belegt:lokal
    profiles: [journal]
    restart: unless-stopped
    command: ["bun", "server/smtp.ts"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      <<: *umgebung
      SMTP_EMPFAENGER: ${SMTP_EMPFAENGER:-}
    ports:
      - "${SMTP_PORT:-2525}:2525"
    volumes:
      - dokumente:/var/lib/belegt
    healthcheck:
      disable: true

  # Sprachmodell für Vorschläge, nur mit: docker compose --profile ki up -d; KI_URL=http://ollama:11434 in .env
  ollama:
    image: docker.io/ollama/ollama:latest
    profiles: [ki]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  # Ansichten als PDF für Office-Dateien, nur mit: docker compose --profile vorschau up -d;
  # VORSCHAU_URL=http://gotenberg:3000 in .env. Im eigenen Netz ohne Internet, denn LibreOffice öffnet fremde Dateien
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    profiles: [vorschau]
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-routes=true"]
    networks: [vorschau]

networks:
  default:
  vorschau:
    internal: true

volumes:
  ollama:
  postgres:
  dokumente:
