# Dokumentation als Website: https://belegt.net/
# Quelle ist docs/, gebaut mit Zensical (.github/workflows/docs.yml), dem Nachfolger von MkDocs Material.
# Lokal: pip install -r requirements-docs.txt && zensical serve
site_name: Belegt
site_description: >-
  Belegt, das selbst gehostete Dokumentenarchiv mit GoBD-Modus: Mails, E-Rechnungen, Scans und beliebige Dokumente,
  unveränderbar bis Fristende, durchsuchbar, mit Prüferzugang und Datenträger für die Betriebsprüfung.
site_url: https://belegt.net/
repo_url: https://github.com/Speicherstadt/belegt
repo_name: Speicherstadt/belegt
edit_uri: edit/main/docs/
# Impressum und Datenschutz im Fuß jeder Seite
copyright: >-
  Lizenz AGPL-3.0 · Keine Steuer- oder Rechtsberatung ·
  <a href="https://teufel-it.de/de/impressum/">Impressum</a> ·
  <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>

docs_dir: docs
# Seiten als betrieb.html statt betrieb/: so stimmen relative Bildpfade auch auf GitHub
use_directory_urls: false

nav:
  - Start: index.md
  - Alle Funktionen: ueberblick.md
  - Betrieb:
      - Installation und Betrieb: betrieb.md
      - Zu Hause betreiben: zuhause.md
      - Anmelden über einen Anbieter, Einbetten: einbetten.md
      - Support und Partnerschaft: support.md
  - Arbeiten mit Belegt:
      - Eingang, Mails und Suche: eingang.md
      - Scannen: scannen.md
      - Von Paperless-ngx zu Belegt: umzug.md
      - Korrespondenten, Tags, Typen und Felder: ordnung.md
      - Workflows: workflows.md
      - Dokument, Seiten und Notizen: dokument.md
      - Fristen und Löschen: fristen.md
      - Teilen per Link: teilen.md
      - Zugänge und Mitarbeiter: zugaenge.md
      - Prüfung, Z1 und Z3: pruefung.md
      - Verfahrensdokumentation: verfahrensdoku.md
  - Schnittstellen:
      - Programme, Webhooks, MCP: schnittstelle.md
      - REST-API: api.md
  - Hintergrund:
      - Glossar: glossar.md
      - Unterlagen für ein Testat: testat.md
      - Entwicklung: entwicklung.md
      - Plan: plan.md

theme:
  name: material
  # SEO: Open Graph, Twitter Card und strukturierte Daten (overrides/main.html)
  custom_dir: overrides
  language: de
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit

plugins:
  - search
  # Schriften (Google Fonts) beim Bauen herunterladen und mit ausliefern: Der Browser lädt nichts von Dritten
  # nach (DSGVO). Zwischenspeicher in .cache/. Ausgenommen sind Skripte, die das Theme nur bei Bedarf nachlädt
  # (Mermaid, Bildergalerie, Python im Browser): Die Doku nutzt sie nicht, und die Galerie zöge Werbe-Skripte
  # für Videos mit.
  - privacy:
      assets_exclude:
        - unpkg.com/*
        - cdn.jsdelivr.net/*

# Startseite als Rundgang in Bildern (index.md)
extra_css:
  - assets/startseite.css

markdown_extensions:
  - admonition
  - pymdownx.quotes:
      callouts: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link zu diesem Abschnitt
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Speicherstadt/belegt
      name: Quellcode auf GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/tristanteu/belegt
      name: Image auf Docker Hub
