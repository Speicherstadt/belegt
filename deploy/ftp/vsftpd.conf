# vsftpd für den Eingangsordner von Belegt (start.sh ergänzt Adresse und TLS). Ein Benutzer, eingesperrt in /eingang.
listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
# Der Scanner lädt nur hoch; wer das Passwort mitliest (ohne TLS im Klartext), kommt so an keine wartende Datei
download_enable=NO
# Dateien 644, Ordner 755; der Worker (UID 1000 wie der Benutzer) entfernt aufgenommene Dateien
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
# Nur der Benutzer aus FTP_BENUTZER darf sich anmelden
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist
pam_service_name=belegt-ftp
# Punktdateien übersieht der Worker; sie anzulegen hätte also nur Liegengebliebenes zur Folge
deny_file={.*}
hide_ids=YES
# Fester Bereich für den passiven Modus; der Container veröffentlicht genau diese Ports
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_addr_resolve=NO
max_clients=5
max_per_ip=5
idle_session_timeout=300
data_connection_timeout=120
# Jede Übertragung mit Dateiname im Log des Containers, nie das Passwort
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/proc/1/fd/1
# Der Seccomp-Filter von vsftpd verträgt sich nicht mit jedem Container-Laufzeitsystem
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
