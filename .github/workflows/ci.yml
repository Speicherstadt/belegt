name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # release.yml ruft die CI vor einem Release auf, wenn main denselben Code nicht schon geprüft hat
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pruefen:
    name: Typecheck, Lint, Tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: belegt
          POSTGRES_PASSWORD: belegt
          POSTGRES_DB: belegt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U belegt -d belegt_test" --health-interval 5s --health-timeout 5s --health-retries 10
      # Vorschau-Dienst für die Ansicht von Office-Dateien; ohne VORSCHAU_TEST_URL würde der Test dazu übersprungen
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3001:3000"]
    env:
      TEST_DATABASE_URL: postgres://belegt:belegt@localhost:5432/belegt_test
      VORSCHAU_TEST_URL: http://localhost:3001
      VALIDATOR_TEST_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v7
      # KoSIT-Validator aus deploy/validator für die Prüfung von E-Rechnungen; ohne VALIDATOR_TEST_URL würde der Test
      # dazu übersprungen. Als eigener Schritt, weil ein Dienst der CI ein fertiges Image bräuchte
      - name: Validator für E-Rechnungen
        run: |
          docker build -t belegt-validator -f deploy/validator/Containerfile deploy/validator
          docker run -d --name validator -p 8081:8080 belegt-validator
          for i in $(seq 1 60); do curl -fsS http://localhost:8081/server/health >/dev/null && exit 0; sleep 2; done
          docker logs validator; exit 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Texterkennung: ohne Tesseract und pdftoppm würden die Tests dazu übersprungen
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu poppler-utils
      - run: bun install --frozen-lockfile
      # Bekannte Sicherheitslücken in Abhängigkeiten
      - run: bun audit
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # Desktop und Handy je in zwei Teilen nebeneinander (Playwright --shard); jeder Teil hat eigene Datenbank und
  # richtet Belegt selbst ein (e2e/einrichten.setup.ts)
  e2e-teil:
    name: E2E ${{ matrix.projekt }} ${{ matrix.teil }}/2
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projekt: [desktop, handy]
        teil: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: belegt
          POSTGRES_PASSWORD: belegt
          POSTGRES_DB: belegt_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U belegt -d belegt_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://belegt:belegt@localhost:5432/belegt_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Vorschaubilder und Seitenbilder rendert pdftoppm, durchsuchbare PDFs von Scans Tesseract; ohne sie fehlen sie in
      # der Oberfläche
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu poppler-utils
      - run: bun install --frozen-lockfile
      # Chromium aus dem Cache, je Playwright-Version; die Systembibliotheken kommen bei jedem Lauf
      - id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # Nur die Testdatenbank: ohne fsync und synchrones Commit schreibt sie schneller
      - name: PostgreSQL ohne fsync
        run: docker exec ${{ job.services.postgres.id }} psql -U belegt -d belegt_e2e -qc "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - run: bun run e2e --project=${{ matrix.projekt }} --shard=${{ matrix.teil }}/2

  # Ein Ergebnis für die Regeln auf main, egal in wie viele Teile die Tests zerfallen
  e2e:
    name: E2E mit Playwright und axe
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [e2e-teil]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-teil.result }}" = success

  container:
    name: Container bauen und starten
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Geheimnisse nur für diesen Lauf
        run: |
          # Getrennte Rollen wie in deploy/compose.env.example: Postgres legt belegt_app beim ersten Start an
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo 'DATABASE_URL=postgres://belegt_app:${APP_DB_PASSWORD}@postgres:5432/belegt'
            echo 'MIGRATION_DATABASE_URL=postgres://belegt:${POSTGRES_PASSWORD}@postgres:5432/belegt'
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BELEGT_SCHLUESSEL=$(openssl rand -base64 32)"
          } > .env
      - run: docker compose build
      # Die Vorlage für einen eigenen Caddy und der Block im Profil https (gleich, deploy/caddy.test.ts)
      - name: Caddyfile gültig
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Server, Oberfläche und Worker antworten
        run: |
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/api/status | grep -q '"eingerichtet":false'
          curl -fsS http://localhost:3000/archiv | grep -q '<html'
          docker compose ps --status running --services | grep -qx worker
          docker compose exec -T server tesseract --list-langs | grep -qx deu
          docker compose exec -T server pdftoppm -v
      - name: Server und Worker arbeiten als App-Rolle, die keine Trigger abschalten kann
        run: |
          q() { docker compose exec -T postgres psql -U "$1" -d belegt -XAtc "$2"; }
          test "$(q belegt "SELECT string_agg(DISTINCT usename, ',') FROM pg_stat_activity WHERE datname = 'belegt' AND backend_type = 'client backend' AND pid <> pg_backend_pid()")" = belegt_app
          for befehl in "ALTER TABLE dokumente DISABLE TRIGGER ALL" "TRUNCATE audit_log" "SET session_replication_role = replica" "UPDATE audit_log SET actor = 'x'"; do
            if q belegt_app "$befehl" 2>/dev/null; then echo "Als belegt_app erlaubt: $befehl"; exit 1; fi
          done
          docker compose logs server | grep -q "App-Anmeldung belegt_app ist eingeschränkt"
          ! docker compose logs server worker | grep -q "mehr Rechte als nötig"
      # FTP-Container (Profil ftp): ein Upload wie von einem Scanner, einmal über FTPS, landet im Eingangsordner und von
      # dort im Archiv; die Dateien gehören UID 1000, damit der Worker sie danach entfernen darf
      - name: FTP für Scanner
        run: |
          mkdir eingang && sudo chown 1000:1000 eingang
          pw=$(openssl rand -hex 12)
          printf 'FTP_BENUTZER=scanner\nFTP_PASSWORT=%s\nFTP_PASV_ADRESSE=127.0.0.1\nFTP_TLS=an\nFTP_PORT=2121\n' "$pw" >> .env
          # Der Worker überwacht den Ordner nur in diesem Lauf; compose.override.yml liest Compose von selbst
          printf 'services:\n  worker:\n    environment:\n      EINGANG_ORDNER: /var/lib/belegt/eingang\n    volumes:\n      - ./eingang:/var/lib/belegt/eingang\n' > compose.override.yml
          docker compose --profile ftp up -d --build ftp worker
          echo "erster Scan" > scan.pdf
          echo "zweiter Scan" > b.pdf
          ok=; for i in $(seq 1 30); do curl -fsS --disable-epsv -T scan.pdf --user "scanner:$pw" ftp://127.0.0.1:2121/scan.pdf && ok=1 && break; sleep 1; done
          test -n "$ok"
          # Herunterladen lehnt der Dienst ab (download_enable=NO), solange die Datei noch auf den Worker wartet
          if curl -fsS --disable-epsv --user "scanner:$pw" ftp://127.0.0.1:2121/scan.pdf -o /dev/null; then echo "Herunterladen erlaubt"; exit 1; fi
          curl -fsS --ssl-reqd -k --ftp-create-dirs -T b.pdf --user "scanner:$pw" ftp://127.0.0.1:2121/Steuer/b.pdf
          if curl -fsS -T scan.pdf --user scanner:falsch ftp://127.0.0.1:2121/x.pdf; then echo "Falsches Passwort angenommen"; exit 1; fi
          q() { docker compose exec -T postgres psql -U belegt -d belegt -XAtc "$1"; }
          for i in $(seq 1 60); do
            test "$(q "SELECT count(*) FROM dokumente WHERE quelle = 'ordner'")" = 2 && break
            sleep 2
          done
          test "$(q "SELECT string_agg(dateiname, ',' ORDER BY dateiname) FROM dokumente WHERE quelle = 'ordner'")" = "b.pdf,scan.pdf"
          # Aufgenommenes entfernt der Worker; übrig bleibt nur der leere Unterordner
          for i in $(seq 1 10); do test -z "$(find eingang -type f)" && break; sleep 1; done
          test -z "$(find eingang -type f)"
      # Backup-Container mit echtem restic: sichern, Test-Restore mit der Prüfung von Belegt, Stand in backup_status
      - name: Backup und Test-Restore
        run: |
          echo "RESTIC_PASSWORD=$(openssl rand -base64 32)" >> .env
          docker compose --profile backup build backup
          docker compose --profile backup run --rm -T backup backup.sh
          q() { docker compose exec -T postgres psql -U belegt -d belegt -XAtc "$1"; }
          test "$(q "SELECT string_agg(art || '=' || ok, ',' ORDER BY id) FROM backup_status")" = "backup=true,restore_check=true"
          q "SELECT meldung FROM backup_status WHERE art = 'restore_check'" | grep -q "Originale gegen ihren Hash geprüft"
          test "$(q "SELECT count(*) FROM pg_database WHERE datname LIKE 'belegt\_restore\_check%'")" = 0
          # Die App-Rolle liest den Stand, schreiben darf sie ihn nicht
          docker compose exec -T postgres psql -U belegt_app -d belegt -XAtc "SELECT count(*) FROM backup_status"
          if docker compose exec -T postgres psql -U belegt_app -d belegt -XAtc "INSERT INTO backup_status (art, ok) VALUES ('backup', true)"; then exit 1; fi
      - if: failure()
        run: docker compose --profile backup --profile ftp logs
      - if: always()
        run: docker compose --profile backup --profile ftp down -v
