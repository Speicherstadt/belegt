name: Release

# Ein Tag vX.Y.Z (Button in bump.yml) veröffentlicht diese Version: erst die CI (übersprungen, wenn sie auf main
# denselben Code schon geprüft hat), dann der gemeinsame Docker-Release aus firsttris/workflows. Der prüft den Tag
# gegen package.json, pusht :x.y.z, :x.y und :latest nach Docker Hub (tristanteu/belegt) und GHCR, für amd64 und
# arm64, setzt die Beschreibung auf Docker Hub aus dem README und legt das GitHub-Release an. Ein Release Candidate
# vX.Y.Z-rc.N pusht :x.y.z-rc.N und :next. Von Hand auf main gestartet: dieselben Prüfungen, dann das Image als :edge.
# Braucht das Secret DOCKER_PAT (Zugangstoken von Docker Hub für tristanteu, Recht Read & Write).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@v1
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  docker:
    needs: [tested, checks]
    # Die Prüfungen liefen durch oder waren nicht nötig
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/belegt
      # Docker Hub erlaubt höchstens 100 Zeichen
      description: "Selbst gehostetes Dokumentenarchiv mit GoBD-Modus: Mails, E-Rechnungen, Scans, Fristen"
      dockerfile: Containerfile
      ghcr: true
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # Backup-Container (deploy/backup) mit denselben Tags, damit Sicherung, Prüfung und Datenbank zur selben Version passen;
  # gebaut aus dem Repository, denn der Test-Restore ruft die Prüfung von Belegt auf. Das GitHub-Release legt nur der
  # Lauf der App an.
  docker-backup:
    needs: [tested, checks]
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    # Eine Version mit den Eingaben ghcr-image, readme und github-release
    uses: firsttris/workflows/.github/workflows/docker-release.yml@5011fb6bf2b7423d211ecffa82218ba067fb5fed # main
    with:
      image: tristanteu/belegt-backup
      description: "Backup für Belegt: pg_dump und Originale mit restic, Test-Restore mit der Prüfung der Kette"
      dockerfile: deploy/backup/Containerfile
      ghcr: true
      ghcr-image: firsttris/belegt-backup
      readme: deploy/backup/README.md
      github-release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # Prüfdienst für E-Rechnungen (deploy/validator), mit denselben Tags wie die App
  docker-validator:
    needs: [tested, checks]
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@5011fb6bf2b7423d211ecffa82218ba067fb5fed # main
    with:
      image: tristanteu/belegt-validator
      description: "KoSIT-Validator mit XRechnung-Konfiguration als Dienst für Belegt: E-Rechnungen prüfen"
      context: deploy/validator
      dockerfile: deploy/validator/Containerfile
      ghcr: true
      ghcr-image: firsttris/belegt-validator
      readme: deploy/validator/README.md
      github-release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # FTP für Netzwerkscanner (deploy/ftp), mit denselben Tags wie die App
  docker-ftp:
    needs: [tested, checks]
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    uses: firsttris/workflows/.github/workflows/docker-release.yml@5011fb6bf2b7423d211ecffa82218ba067fb5fed # main
    with:
      image: tristanteu/belegt-ftp
      description: "FTP für Netzwerkscanner: schreibt in den Eingangsordner von Belegt, nur im eigenen Netz"
      context: deploy/ftp
      dockerfile: deploy/ftp/Containerfile
      ghcr: true
      ghcr-image: firsttris/belegt-ftp
      readme: deploy/ftp/README.md
      github-release: false
    secrets: inherit
    permissions:
      contents: write
      packages: write
