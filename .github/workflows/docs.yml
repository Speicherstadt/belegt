# Baut docs/ mit Zensical und veröffentlicht sie auf GitHub Pages: https://firsttris.github.io/belegt/
# In Pull Requests nur bauen (ein kaputter Link oder eine fehlende Seite fällt vor dem Merge auf), auf main
# veröffentlichen. Voraussetzung einmalig: Settings → Pages → Source „GitHub Actions“ (configure-pages schaltet das
# beim ersten Lauf selbst ein).
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/docs.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - run: zensical build --strict
      # Jede Seite mit eigener Beschreibung (Suchmaschinen, Vorschau beim Teilen)
      - run: test -z "$(grep -L '^description:' docs/*.md)"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
