# Baut docs/ mit Zensical und die Demo (bun run build:demo, src/demo/) und veröffentlicht beides auf GitHub Pages:
# https://belegt.store/ und …/demo/
# In Pull Requests nur bauen (ein kaputter Link oder eine fehlende Seite fällt vor dem Merge auf), auf main
# veröffentlichen. Voraussetzung einmalig, von Hand: Settings → Pages → Source „GitHub Actions“. Anlegen kann die
# Seite der Token des Workflows nicht (Resource not accessible by integration).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # Die Demo ist die App: jede Änderung an ihr ändert die Demo
      - "src/**"
      - "shared/**"
      - "messages/**"
      - "demo/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      # Die Demo ist die App: jede Änderung an ihr ändert die Demo
      - "src/**"
      - "shared/**"
      - "messages/**"
      - "demo/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
  # Nach „Screenshots erneuern“: dessen Commit mit dem GITHUB_TOKEN startet kein on: push, darum ruft er die Docs auf
  workflow_call:
    inputs:
      ref:
        description: "Stand, der gebaut wird (leer: der auslösende Commit)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: zensical build --strict
      # Start page as https://belegt.store/, not index.html: canonical, og:url and sitemap. With
      # use_directory_urls: false Zensical writes index.html, Google then reports it as a duplicate
      - run: |
          sed -i 's#"https://belegt.store/index.html"#"https://belegt.store/"#g' site/index.html
          sed -i 's#<loc>https://belegt.store/index.html</loc>#<loc>https://belegt.store/</loc>#' site/sitemap.xml
          grep -q '<link rel="canonical" href="https://belegt.store/"' site/index.html
      # Jede Seite mit eigener Beschreibung (Suchmaschinen, Vorschau beim Teilen)
      - run: test -z "$(grep -L '^description:' docs/*.md)"
      # Die Demo unter /demo/, mit der Aufnahme aus „Screenshots erneuern“ (demo/aufnahme.json)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile && bun run build:demo && cp -r dist-demo site/demo
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
